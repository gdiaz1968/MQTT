<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monitor de Planta</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 30px;
}

h1 {
    text-align: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.maquina {
    font-weight: bold;
    margin-bottom: 10px;
}

.valor {
    font-size: 32px;
    color: #38bdf8;
}

.fecha {
    font-size: 12px;
    color: #94a3b8;
}

.estado {
    text-align: center;
    margin-top: 10px;
}
</style>
</head>
<body>

<h1>📡 Monitor de Producción</h1>

<div class="estado" id="estado">Conectando...</div>

<div class="grid" id="grid"></div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io()

const grid = document.getElementById('grid')
const estadoEl = document.getElementById('estado')

// ==========================
// CONEXIÓN
// ==========================
socket.on('connect', () => {
    estadoEl.innerText = '🟢 Conectado'
})

socket.on('disconnect', () => {
    estadoEl.innerText = '🔴 Desconectado'
})

// ==========================
// RENDER
// ==========================
function render(maquinas) {
    grid.innerHTML = ''

    maquinas.forEach(m => {
        const card = document.createElement('div')
        card.className = 'card'

        card.innerHTML = `
            <div class="maquina">${m.maquina}</div>
            <div class="valor">${m.valor}</div>
            <div class="fecha">${new Date(m.timestamp).toLocaleString()}</div>
        `

        grid.appendChild(card)
    })
}

// ==========================
// SOCKET DATA
// ==========================
socket.on('datos', (data) => {
    console.log('DATA FRONT:', data)
    render(data)
})

// ==========================
// FALLBACK (carga inicial)
// ==========================
fetch('/estado')
.then(res => res.json())
.then(data => {
    if (Array.isArray(data)) {
        render(data)
    }
})
</script>

</body>
</html>
